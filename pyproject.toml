[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# The PyPI package `autoresearcheval` is the agent-as-a-judge library, published from
# agent-as-a-judge/pyproject.toml. This project is the research code around it — task
# construction, the scoring harness, the trajectory IR — installed locally for
# development and not published, so it takes a distinct name.
name = "autoresearcheval-bench"
version = "0.0.1"
description = "AutoResearchEval benchmark code: task construction, scoring scaffolding, and trajectory IR."
readme = "README.md"
requires-python = ">=3.10"
# Core runtime deps are intentionally minimal. Source-specific heavy deps
# (aiida-core, emmet-core, mp_api, custodian, mlflow, wandb, MLIP packages)
# are OPTIONAL extras so the IR / export / verify core stays importable
# without a full computational-chemistry stack. Versions are pinned in
# requirements.lock.
dependencies = [
    "pydantic>=2.0,<3.0",
]

[project.optional-dependencies]
aiida = ["aiida-core"]
atomate2 = ["emmet-core", "atomate2", "pymatgen"]
mp = ["mp_api"]
custodian = ["custodian"]
tracking = ["mlflow", "wandb"]
mlip = ["mace-torch", "chgnet", "matgl"]
dev = ["pytest>=7", "pytest-cov"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ir*", "adapters*", "reconstruct*", "verify*", "export*", "harness*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
